name: Build and Push ComfyUI Docker Images

on:
  workflow_dispatch:
    inputs:
      components:
        description: "要构建的组件列表 (逗号分隔，例如: cu130-megapak-pt211,cu130-slim)"
        required: false
        default: "cu130-megapak-pt211"
      install_3dgs:
        description: "安装3DGS运行依赖（节点及示例始终由ToolBox提供；使用-3dgs标签）"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
      - master
    paths:
      - "cu130-*/**"
      - "Makefile"
      - ".github/workflows/build-comfyui.yaml"
  schedule:
    - cron: "0 0 * * 0"

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  REPO_NAME: eazycloud
  IMAGE_NAME: eazycloud/comfyui-custom
  MAX_JOBS: 4
  TORCH_CUDA_ARCH_LIST: "8.0;8.6;10.0;12.0;12.0+PTX"
  INSTALL_3DGS: ${{ github.event_name == 'workflow_dispatch' && inputs.install_3dgs && 'true' || 'false' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check optional 3DGS build feature
        run: python3 -m unittest discover -s cu130-megapak-pt211/tests -v

      # === 前置清理与状态打印 ===
      # - name: Cleanup and System Check
      #   run: |
      #     echo "========================================================="
      #     echo "【清理前】系统内存与磁盘状态："
      #     echo "========================================================="
      #     free -h
      #     echo ""
      #     df -h
      #     echo ""

      #     echo "========================================================="
      #     echo "开始清理不需要的系统组件..."
      #     echo "========================================================="

      #     # 1. 移除不常用的庞大软件及工具包 (大型语言环境、.NET、Android SDK等)
      #     sudo rm -rf /usr/share/dotnet
      #     sudo rm -rf /usr/local/lib/android
      #     sudo rm -rf /opt/ghc
      #     sudo rm -rf /opt/hostedtoolcache/CodeQL

      #     # 2. 清理系统软件包缓存
      #     sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' 'google-chrome-stable' 'microsoft-edge-stable' azure-cli google-cloud-sdk mono-devel powershell firefox
      #     sudo apt-get autoremove -y
      #     sudo apt-get clean

      #     # 3. 清理 Docker 默认残留（GitHub 环境中可能存在一些基础镜像缓存）
      #     docker rmi $(docker images -q) 2>/dev/null || true
      #     docker builder prune -a -f

      #     echo "========================================================="
      #     echo "【清理后】系统内存与磁盘状态："
      #     echo "========================================================="
      #     free -h
      #     echo ""
      #     df -h
      #     echo "========================================================="
      - name: Cleanup and System Check
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================================="
          echo "【系统信息】"
          echo "========================================================="
          cat /etc/os-release

          echo "========================================================="
          echo "【清理前】系统内存与磁盘状态"
          echo "========================================================="
          free -h
          df -h

          echo "========================================================="
          echo "【1】清理不需要的大型 SDK 和工具包"
          echo "========================================================="

          # .NET SDK
          sudo rm -rf /usr/share/dotnet

          # Android SDK
          sudo rm -rf /usr/local/lib/android

          # Haskell GHC
          sudo rm -rf /opt/ghc

          # CodeQL
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          # Swift SDK
          sudo rm -rf /usr/share/swift

          echo "========================================================="
          echo "【2】清理 APT 缓存"
          echo "========================================================="

          sudo apt-get clean

          echo "========================================================="
          echo "【3】清理 Docker 镜像及构建缓存"
          echo "========================================================="

          # 清理未被容器使用的镜像
          docker image prune -a -f

          # 清理 Docker BuildKit 缓存
          docker builder prune -a -f

          echo "========================================================="
          echo "【4】清理临时文件"
          echo "========================================================="

          # 清理当前用户的 pip 缓存
          python -m pip cache purge || true

          # 清理当前用户的 npm 缓存
          npm cache clean --force || true

          echo "========================================================="
          echo "【清理后】系统内存与磁盘状态"
          echo "========================================================="
          free -h
          df -h

          echo "========================================================="
          echo "系统清理完成"
          echo "========================================================="
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Run Makefile Build and Push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ ! -z "${{ github.event.inputs.components }}" ]; then
            echo "Executing list-based build for components: ${{ github.event.inputs.components }}"
            make push-list \
              REGISTRY="${{ env.REGISTRY }}" \
              IMAGE_NAME="${{ env.IMAGE_NAME }}" \
              MAX_JOBS="${{ env.MAX_JOBS }}" \
              INSTALL_3DGS="$INSTALL_3DGS" \
              TORCH_CUDA_ARCH_LIST="${{ env.TORCH_CUDA_ARCH_LIST }}" \
              LIST="${{ github.event.inputs.components }}"
          else
            echo "Executing all-inclusive build..."
            make push-all \
              REGISTRY="${{ env.REGISTRY }}" \
              IMAGE_NAME="${{ env.IMAGE_NAME }}" \
              MAX_JOBS="${{ env.MAX_JOBS }}" \
              INSTALL_3DGS="$INSTALL_3DGS" \
              TORCH_CUDA_ARCH_LIST="${{ env.TORCH_CUDA_ARCH_LIST }}"
          fi
